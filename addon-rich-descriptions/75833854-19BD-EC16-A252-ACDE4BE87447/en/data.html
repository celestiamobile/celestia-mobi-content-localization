<p><strong>21 Lutetia</strong> is a large M-type main-belt asteroid about 120 km in diameter. It was visited by <i><a href="celaddon://item?item=77DCDAB9-5C56-208C-ADAC-56F51AD6512F">Rosetta</a></i> at a distance of 3,162 km on 10 July 2010, which it briefly became the largest asteroid ever visited by a spacecraft until <i><a href="celaddon://item?item=EDC63D7E-A49B-AEF6-DBBD-2B4CFF684361">Dawn</a></i> inserted itself into orbit around <a href="celaddon://item?item=610C57F5-872F-52BC-DD23-954A44D4001D">4 Vesta</a> just a year later.</p>
